[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pubspec2ebuild"
version = "0.1.0"
description = "Turn a pubspec.lock into the PUB_HOSTED and PUB_GIT arrays dart-pub.eclass reads"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
pubspec2ebuild = "pubspec2ebuild:main"

[tool.setuptools.packages.find]
where = ["src"]
